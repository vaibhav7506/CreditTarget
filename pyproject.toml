[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credittarget"
version = "0.1.0"
description = "Distributed Banking Customer Targeting & Model Risk Lifecycle Platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyspark>=3.5.3,<3.6.0",
    "delta-spark>=3.2.0,<3.3.0",
    "pyarrow>=15.0,<19.0",
    "pandas>=2.1,<2.3",
    "numpy>=1.26,<2.1",
    "scikit-learn>=1.4,<1.7",
    "lightgbm>=4.3",
    "mlflow>=2.14,<3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "mangum>=0.17",
    "prometheus-client>=0.20",
    "jinja2>=3.1",
    "boto3>=1.34",
    "sqlalchemy>=2.0.0,<2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "chispa>=0.10.1",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
credittarget = "credittarget.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
no_implicit_reexport = false
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = [
    "pyspark.*",
    "delta.*",
    "mlflow.*",
    "lightgbm.*",
    "mangum.*",
    "sklearn.*",
    "scipy.*",
    "boto3.*",
    "pandas.*",
    "pandas",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
